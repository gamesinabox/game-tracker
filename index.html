<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="signed-out">
    <h1>Backlog</h1>
    <p>Your personal game library, notes, and backlog — synced across every device.</p>
    <button class="btn btn-primary" id="sign-in-btn">Sign in with Google</button>
    <p class="hint" id="signed-out-error"></p>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1>Backlog</h1>
      <div class="topbar-right">
        <button class="btn btn-primary" id="add-game-btn">+ Add game</button>
        <div class="user-chip">
          <img id="user-avatar" alt="" />
          <span id="user-name"></span>
        </div>
        <button class="btn" id="sign-out-btn">Sign out</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="library">Library</button>
    </nav>

    <main>
      <!-- ---------------- Dashboard ---------------- -->
      <section class="view" id="view-dashboard">
        <section>
          <h2>Stats</h2>
          <div class="stat-grid" id="stat-grid"></div>
        </section>

        <section>
          <h2>Currently playing</h2>
          <div class="spotlight-row" id="spotlight-row"></div>
          <p class="empty-hint" id="spotlight-empty" hidden>Nothing marked "Playing" right now.</p>
        </section>

        <section>
          <h2>What should I play next?</h2>
          <div class="picker-box">
            <div class="picker-result" id="picker-result">
              <span class="empty-hint">Pick a random game from your backlog.</span>
            </div>
            <button class="btn btn-primary" id="picker-btn">Roll the dice</button>
          </div>
        </section>

        <section>
          <div class="toolbar">
            <button class="btn" id="export-btn">Export JSON</button>
            <button class="btn" id="import-btn">Import JSON</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </section>
      </section>

      <!-- ---------------- Library ---------------- -->
      <section class="view" id="view-library" hidden>
        <div class="filter-bar">
          <input type="search" id="filter-search" placeholder="Search titles…" />
          <select id="filter-status">
            <option value="all">All statuses</option>
            <option value="backlog">Backlog</option>
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
            <option value="shelved">Shelved</option>
          </select>
          <select id="filter-platform">
            <option value="all">All platforms</option>
          </select>
          <select id="filter-tag">
            <option value="all">All tags</option>
          </select>
          <select id="filter-sort">
            <option value="added-desc">Recently added</option>
            <option value="rating-desc">Highest rated</option>
            <option value="rating-asc">Lowest rated</option>
            <option value="title-asc">Title A–Z</option>
            <option value="priority-asc">Backlog priority</option>
          </select>
        </div>
        <div class="game-grid" id="game-grid"></div>
        <p class="empty-hint" id="library-empty" hidden>No games match these filters yet.</p>
      </section>
    </main>
  </div>

  <!-- ---------------- Add / Edit modal ---------------- -->
  <div class="modal-backdrop" id="edit-modal-backdrop" hidden>
    <div class="modal">
      <button class="modal-close" id="edit-modal-close">&times;</button>
      <h2 id="edit-modal-title">Add game</h2>

      <div class="field">
        <label for="rawg-search">Search (auto-fills cover art &amp; metadata)</label>
        <input type="text" id="rawg-search" placeholder="Start typing a title…" autocomplete="off" />
        <div class="rawg-results" id="rawg-results" hidden></div>
      </div>

      <div class="field">
        <label for="game-title">Title</label>
        <input type="text" id="game-title" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="game-platform">Platform</label>
          <input type="text" id="game-platform" placeholder="e.g. Switch, PC, PS5" />
        </div>
        <div class="field">
          <label for="game-status">Status</label>
          <select id="game-status">
            <option value="backlog">Backlog</option>
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
            <option value="shelved">Shelved</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="game-price">Price paid ($)</label>
          <input type="number" id="game-price" min="0" step="0.01" />
        </div>
        <div class="field">
          <label for="game-acquisition">Acquired via</label>
          <select id="game-acquisition">
            <option value="owned">Bought / own</option>
            <option value="subscription">Subscription (Game Pass, PS+…)</option>
            <option value="gift">Gift</option>
            <option value="borrowed">Borrowed</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="game-tags">Tags (comma separated)</label>
        <input type="text" id="game-tags" placeholder="cozy, roguelike, co-op" />
      </div>

      <div class="field">
        <label for="game-priority">Backlog priority (lower = play sooner)</label>
        <input type="number" id="game-priority" step="1" />
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="edit-delete-btn" hidden>Delete</button>
        <div class="right">
          <button class="btn" id="edit-cancel-btn">Cancel</button>
          <button class="btn btn-primary" id="edit-save-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------- Detail modal ---------------- -->
  <div class="modal-backdrop" id="detail-modal-backdrop" hidden>
    <div class="modal">
      <button class="modal-close" id="detail-modal-close">&times;</button>

      <div class="detail-header">
        <div class="detail-cover" id="detail-cover"></div>
        <div>
          <p class="detail-title" id="detail-title"></p>
          <p class="detail-meta" id="detail-meta"></p>
          <div class="rating-stars" id="detail-stars"></div>
          <div class="tag-row" id="detail-tags"></div>
        </div>
      </div>

      <button class="btn" id="detail-edit-btn">Edit details</button>

      <div class="subsection">
        <h3>Session log</h3>
        <div id="detail-sessions"></div>
        <div class="log-add-row">
          <input type="date" id="session-date" />
          <input type="number" id="session-minutes" placeholder="mins" style="width:70px" min="0" />
          <input type="text" class="note" id="session-note" placeholder="What happened this session?" />
          <button class="btn" id="session-add-btn">Log</button>
        </div>
      </div>

      <div class="subsection">
        <h3>Memories</h3>
        <div id="detail-memories"></div>
        <div class="log-add-row">
          <input type="date" id="memory-date" />
          <input type="text" class="note" id="memory-note" placeholder="A standout moment worth remembering…" />
          <button class="btn" id="memory-add-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
